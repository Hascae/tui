[workspace]
resolver = "3"
members = ["term", "net", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
